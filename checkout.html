<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Luxe with MJ</title>
<link rel="icon" href="assets/logo.jpeg"><link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"></head><body>
<header><a class="brand" href="shop.html"><img src="assets/logo.jpeg" alt="MJ"><b class="script gold">Luxe with MJ</b></a><nav><a class="hide" href="shop.html#shop">Shop</a><a class="hide" href="shop.html#why">Why MJ</a><a class="hide" href="shop.html#love">Reviews</a><button class="cartbtn" onclick="location.href='shop.html'">BAG (<span class="cc">0</span>)</button></nav></header>
<div class="checkout"><form onsubmit="order(event)"><h1 class="serif" style="font-size:2.6rem">Secure <span class="script gold">checkout</span></h1>
<div class="two"><label>Full name<input name="name" required></label><label>Phone / WhatsApp<input name="phone" type="tel" required></label></div>
<label>Email<input name="email" type="email" required></label><label>Delivery address<input name="addr" required></label>
<div class="two"><label>City / State<input name="city" required></label><label>Delivery<select name="ship" id="ship"><option value="3000">Lagos (₦3,000)</option><option value="3500">Abuja (₦3,500)</option><option value="6500">Other states (₦6,500)</option><option value="0">Pickup (free)</option></select></label></div>
<label>Order note<textarea name="note" rows="2" placeholder="Wig size, lace tint, custom styling…"></textarea></label>
<div class="pay"><label><input type="radio" name="pay" value="paystack" checked> Pay now · Card / Bank transfer / USSD (Paystack)</label><label><input type="radio" name="pay" value="wa"> Confirm via WhatsApp · Transfer or pay on delivery (Lagos/Abuja)</label></div>
<button class="btn" type="submit">Place order</button></form>
<div class="summary"><h3 class="serif" style="font-size:1.8rem;margin-bottom:10px">Order summary</h3><div id="osum"></div><p style="font-size:.72rem;opacity:.6;margin-top:10px">Secure payment · Easy exchanges on unworn units</p></div></div>
<script src="https://js.paystack.co/v1/inline.js"></script><script src="script.js"></script>
<script>document.getElementById('drawer')||0</script></body></html>
